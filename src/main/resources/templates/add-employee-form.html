<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        .form-container {
            max-width: 500px;
            background: #f9f9f9;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 10px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn-secondary {
            background-color: #888;
        }

        .btn-secondary:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <h1>Add New Employee</h1>

    <div class="form-container">
        <form th:action="@{/employee}" th:object="${employee}" method="post" onsubmit="return validateLanguageSelection();">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" th:field="*{name}" required
                       minlength="1" title="Name cannot be blank">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <!-- Contact Number -->
            <div class="form-group">
                <label for="contactNum">Contact Number:</label>
                <input type="tel" id="contactNum" th:field="*{contactNum}" required
                       pattern="[0-9]{10}" title="Enter a 10-digit phone number">
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" th:field="*{gender}" required>
                    <option value="" disabled selected>Select gender</option>
                    <option th:each="g : ${T(com.mediquity.employee.enums.Gender).values()}"
                            th:value="${g}" th:text="${g}"></option>
                </select>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" th:field="*{age}" required
                       min="18" max="65" title="Age must be between 18 and 65">
            </div>

            <!-- Marital Status -->
            <div class="form-group">
                <label for="maritalStatus">Marital Status:</label>
                <select id="maritalStatus" th:field="*{maritalStatus}" required>
                    <option value="" disabled selected>Select marital status</option>
                    <option th:each="m : ${T(com.mediquity.employee.enums.MaritalStatus).values()}"
                            th:value="${m}" th:text="${m}"></option>
                </select>
            </div>

            <!-- Nationality -->
            <div class="form-group">
                <label for="nationality">Nationality:</label>
                <select id="nationality" th:field="*{nationality}" required>
                    <option value="" disabled selected>Select nationality</option>
                    <option th:each="n : ${T(com.mediquity.employee.enums.Nationality).values()}"
                            th:value="${n}" th:text="${n}"></option>
                </select>
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label for="bloodGroup">Blood Group:</label>
                <select id="bloodGroup" th:field="*{bloodGroup}">
                    <option value="" disabled selected>Select blood group</option>
                    <option th:each="b : ${T(com.mediquity.employee.enums.BloodGroup).values()}"
                            th:value="${b}" th:text="${b}"></option>
                </select>
            </div>

            <!-- Language -->
            <div class="form-group" id="languageGroup">
                <label>Languages Spoken:</label><br>
                <div th:each="lang : ${T(com.mediquity.employee.enums.Language).values()}">
                    <input type="checkbox" th:field="*{language}" th:value="${lang}" id="${lang}" class="languageCheckbox">
                    <label th:for="${lang}" th:text="${lang}"></label><br>
                </div>
                <p id="languageError" style="color:red; display:none;">Please select at least one language.</p>
            </div>

            <!-- Buttons -->
            <div class="form-group">
                <button type="submit" class="btn">Save</button>
                <a th:href="@{/home}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        function validateLanguageSelection() {
            const checkboxes = document.querySelectorAll('.languageCheckbox');
            const error = document.getElementById('languageError');
            let isChecked = false;
        
            checkboxes.forEach(cb => {
                if (cb.checked) isChecked = true;
            });
        
            if (!isChecked) {
                error.style.display = 'block';
                return false; // prevent form submission
            } else {
                error.style.display = 'none';
                return true; // allow form submission
            }
        }
    </script>

</body>
</html>
