<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        .form-container {
            margin-top: 30px;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Edit Employee</h1>

    <div class="form-container">
        <form th:action="@{'/employee/update/' + ${employee.id}}" th:object="${employee}" method="post">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" th:field="*{name}" required />
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" required />
            </div>

            <div class="form-group">
                <label>Contact Number:</label>
                <input type="tel" th:field="*{contactNum}" required pattern="[0-9]{10}" title="Enter a 10-digit number" />
            </div>

            <button class="btn" type="submit">Update</button>
        </form>

        <a href="/home" class="back-link">← Back to Employee List</a>
    </div>
</body>
</html>
