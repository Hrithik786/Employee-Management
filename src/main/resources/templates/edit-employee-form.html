<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        h1 {
            text-align: center;
            color: #343a40;
            margin-top: 40px;
        }

        .form-container {
            background-color: #ffffff;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Edit Employee</h1>

    <div class="form-container">
        <form th:action="@{'/employee/update/' + ${employee.id}}" th:object="${employee}" method="post">
            
            <!-- Name -->
            <div class="form-group">
                <label>Name:</label>
                <input type="text" th:field="*{name}" required />
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" required />
            </div>

            <!-- Contact Number -->
            <div class="form-group">
                <label>Contact Number:</label>
                <input type="tel" th:field="*{contactNum}" required pattern="[0-9]{10}" title="Enter a 10-digit number" />
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <label th:each="g : ${T(com.mediquity.employee.enums.Gender).values()}">
                        <input type="radio" th:field="*{gender}" th:value="${g}" /> <span th:text="${g}">Gender</span>
                    </label>
                </div>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label>Age:</label>
                <input type="number" min="18" max="65" th:field="*{age}" required />
            </div>

            <!-- Marital Status -->
            <div class="form-group">
                <label>Marital Status:</label>
                <select th:field="*{maritalStatus}" required>
                    <option value="" disabled>Select Status</option>
                    <option th:each="status : ${T(com.mediquity.employee.enums.MaritalStatus).values()}"
                            th:value="${status}" th:text="${status}">
                    </option>
                </select>
            </div>

            <!-- Languages -->
            <div class="form-group">
                <label>Languages Known:</label>
                <div class="checkbox-group">
                    <label th:each="lang : ${T(com.mediquity.employee.enums.Language).values()}">
                        <input type="checkbox" th:field="*{language}" th:value="${lang}" />
                        <span th:text="${lang}">Language</span>
                    </label>
                </div>
            </div>

            <!-- Nationality -->
            <div class="form-group">
                <label>Nationality:</label>
                <select th:field="*{nationality}" required>
                    <option value="" disabled>Select Nationality</option>
                    <option th:each="n : ${T(com.mediquity.employee.enums.Nationality).values()}"
                            th:value="${n}" th:text="${n}">
                    </option>
                </select>
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label>Blood Group:</label>
                <select th:field="*{bloodGroup}">
                    <option value="" disabled>Select Blood Group</option>
                    <option th:each="bg : ${T(com.mediquity.employee.enums.BloodGroup).values()}"
                            th:value="${bg}" th:text="${bg}">
                    </option>
                </select>
            </div>

            <!-- Submit Button -->
            <button class="btn" type="submit">Update</button>
        </form>

        <a href="/home" class="back-link">← Back to Employee List</a>
    </div>
</body>
</html>
