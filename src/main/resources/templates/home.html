<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Employees</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #2c3e50;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions form {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Employee List</h1>
        <a href="/employee/add" class="btn">Add New Employee</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Contact Number</th>
                <th>Marital Status</th>
                <th>Gender</th>
                <th>Age</th>
                <th>Nationality</th>
                <th>BloodGroup</th>
                <th>Language</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="employee, stat : ${employees}">
                <td th:text="${stat.index + 1}"></td> <!-- 1-based index -->
                <td th:text="${employee.name}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.contactNum}"></td>
                <td th:text="${employee.maritalStatus}"></td>
                <td th:text="${employee.gender}"></td>
                <td th:text="${employee.age}"></td>
                <td th:text="${employee.nationality}"></td>
                <td th:text="${employee.bloodGroup}"></td>
                <td th:text="${#strings.listJoin(employee.language, ', ')}"></td>


                <td class="actions">
                    <a th:href="@{'/employee/edit/' + ${employee.id}}">
                        <button class="btn">Edit</button>
                    </a>
                    <form th:action="@{'/employee/delete/' + ${employee.id}}" method="post" onsubmit="return confirmDelete();">
                        <button class="btn-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        function confirmDelete() {
            return confirm("Are you sure you want to delete this employee?");
        }
    </script>
</body>
</html>
