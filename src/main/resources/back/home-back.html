<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .actions button {
            margin-right: 5px;
            padding: 5px 10px;
        }

        .form-container {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"], input[type="email"] {
            width: 300px;
            padding: 8px;
        }

        .btn {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn-danger {
            background-color: #f44336;
        }

        .btn-danger:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>
    <h1>Employee Management</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>ContactNum</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.name}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.contactNum}"></td>
                <td class="actions">
                    <a th:href="@{'/employee/' + ${employee.id}}">
                        <button>Edit</button>
                    </a>
                    <form th:action="@{'/employee/' + ${employee.id}}" method="post" style="display:inline;" onsubmit="return confirmDelete();">
                        <button class="btn-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="form-container">
        <h2 th:text="${employee != null} ? 'Edit Employee' : 'Add New Employee'"></h2>
        <form th:action="${employee != null} ? @{'/employee/' + ${employee.id}} : @{/employee}" method="post">
            <div class="form-group">
                <label>Name:</label><br>
                <input type="text" name="name" th:value="${employee?.name}" required>
            </div>
            <div class="form-group">
                <label>Email:</label><br>
                <input type="email" name="email" th:value="${employee?.email}" required>
            </div>
            <div class="form-group">
                <label for="contactNum">Contact Number:</label><br>
                <input type="tel" id="contactNum" name="contactNum" th:value="${employee?.contactNum}" 
                    required pattern="[0-9]{10}" title="Enter a 10-digit phone number">
            </div>

            <button class="btn" type="submit" th:text="${employee != null} ? 'Update' : 'Save'"></button>
        </form>
    </div>

    <script>
        function confirmDelete() {
            return confirm("Are you sure you want to delete this employee?");
        }
    </script>
</body>
</html>
