<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add / Edit Employee</title>
    <style>/* same styles as before */</style>
</head>
<body>
    <h1 th:text="${employee.id} != null ? 'Edit Employee' : 'Add New Employee'"></h1>

    <form th:action="@{${employee.id} != null ? '/employee/update/' + ${employee.id} : '/employee'}" method="post">
        <div class="form-group">
            <label>Name:</label><br>
            <input type="text" name="name" th:value="${employee.name}" required>
        </div>
        <div class="form-group">
            <label>Email:</label><br>
            <input type="email" name="email" th:value="${employee.email}" required>
        </div>
        <div class="form-group">
            <label>Contact Number:</label><br>
            <input type="tel" name="contactNum" th:value="${employee.contactNum}" required 
                   pattern="[0-9]{10}" title="Enter a 10-digit number">
        </div>

        <button class="btn" type="submit" th:text="${employee.id} != null ? 'Update' : 'Save'"></button>
    </form>
</body>
</html>
